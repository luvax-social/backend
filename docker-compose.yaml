# Every published port is bound to the loopback interface. These services carry real credentials
# and hold real data, and publishing them on all interfaces exposes a developer's database, cache,
# broker, and search cluster to anyone on the same network.
services:
  postgres:
    build: ./docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - '127.0.0.1:5432:5432'
    # PGDATA in postgres:18 is /var/lib/postgresql/18/docker, not the pre-18
    # /var/lib/postgresql/data. Mounting the parent covers it and matches where the image's own
    # anonymous volume sat. A named volume at the pre-18 path would create an empty directory
    # nobody reads and leave the real data on a volume discarded with the container.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # $$ defers expansion to the container shell, so the probe reads the credentials the
      # container was actually started with rather than whatever Compose interpolated at parse time.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    # The -management tag is what serves the UI published below; the plain tag omits the plugin.
    # Pinned to 4.3 (from 4): rabbitmq_prometheus is already enabled in this image, so 15692 only
    # needed publishing.
    image: 'rabbitmq:4.3-management'
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
      - '127.0.0.1:15692:15692'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    # Pinned to production's 9.2.5 (from 9.0.3).
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.5
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Left disabled deliberately. Enabling it would require credential wiring through the
      # application and every integration test for no local benefit, and the loopback bind above
      # is what actually removes the exposure that mattered.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10

  # The recommender behind the personalized feed. It lived in an overlay compose file until now,
  # which meant the default `docker compose up -d` never started it: the engagement consumer is
  # enabled in dev and prod, so every post.liked/saved/viewed and comment.created event retried
  # against a service that was not there and then dead-lettered.
  gorse:
    image: zhenghaoz/gorse-in-one:0.5.11
    restart: unless-stopped
    # --cache-path is a folder in v0.5.11 (default /var/lib/gorse/master, holds the SQLite
    # meta db); passing a file path breaks startup with SQLITE_CANTOPEN
    command: >
      -c /etc/gorse/config.toml
      --log-path /var/lib/gorse/gorse.log
    environment:
      # Cache store is Postgres, not the app Redis: Gorse v0.5.x Redis cache requires the
      # RediSearch module (FT.* commands) which plain redis:7-alpine does not ship. The gorse
      # database is created by docker/postgres/init/01-create-gorse-db.sql, which only runs on
      # first boot of an empty volume; on an existing volume create it by hand, or the container
      # restart-loops on "database gorse does not exist".
      GORSE_DATA_STORE: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/gorse?sslmode=disable
      GORSE_CACHE_STORE: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/gorse?sslmode=disable
      GORSE_SERVER_API_KEY: ${GORSE_API_KEY}
      GORSE_DASHBOARD_USER_NAME: ${GORSE_DASHBOARD_USER}
      GORSE_DASHBOARD_PASSWORD: ${GORSE_DASHBOARD_PASSWORD}
    ports:
      # Dashboard and REST API share this port in gorse-in-one. Loopback-only, like every other
      # service here; reach the dashboard over an SSH tunnel rather than by publishing it.
      - "127.0.0.1:8088:8088"
    volumes:
      - ./gorse/config/config.toml:/etc/gorse/config.toml:ro
      - gorse_data:/var/lib/gorse
    # The image ships no curl, wget or nc, so the probe uses the bash the image does have.
    # /api/health/ready reports data-store and cache-store connectivity rather than only that
    # the port is open, which is what distinguishes a working Gorse from one restart-looping on
    # a missing database.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8088 && printf "GET /api/health/ready HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  elasticsearch_data:
  gorse_data:

# Named so the root observability profile can join it as an external network.
networks:
  default:
    name: luvax-local
