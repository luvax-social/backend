<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{mail/moderation/layout :: page('Your account is now verified', ~{::statement})}">
<body>
<div th:fragment="statement">
<p style="font-size: 15px; color: #4B4B4B; line-height: 1.6; margin: 0 0 16px;">Your verification request has been approved. A verified badge now appears beside your name across the platform.</p>
<blockquote style="margin: 0 0 16px; padding: 12px 16px; border-left: 3px solid #E8E8E8; color: #4B4B4B; font-size: 15px; line-height: 1.6; white-space: pre-wrap;" th:text="${supportResponse}">The reviewer's note.</blockquote>
</div>
</body>
</html>
