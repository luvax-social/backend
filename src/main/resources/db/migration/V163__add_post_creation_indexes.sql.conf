# CREATE INDEX CONCURRENTLY cannot run inside a transaction block, so this migration opts out of
# Flyway's default transactional execution, as every other index migration here does.
#
# A failed CONCURRENTLY build leaves an INVALID index behind rather than rolling back. Every
# statement is IF NOT EXISTS, so a re-run after a failure is safe once the invalid index has been
# dropped by hand. Check with:
#   SELECT c.relname FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid
#    WHERE NOT i.indisvalid;
executeInTransaction=false
