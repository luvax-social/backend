# DROP INDEX CONCURRENTLY cannot run inside a transaction block, so this migration opts out of
# Flyway's default transactional execution, as every other index migration here does.
#
# The tradeoff this buys and the one it costs:
#   Buys - no ACCESS EXCLUSIVE lock on notifications while each index is dropped, so reads and
#          writes to the table continue throughout.
#   Costs - statements are not applied atomically. Each is DROP INDEX CONCURRENTLY IF EXISTS, so a
#          re-run after a partial failure drops whatever remains and skips what is already gone.
executeInTransaction=false
